<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=500, height=178">
<title>Chip Collision — 1D Elastic</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 500px;
  height: 178px;
  overflow: hidden;
  font-family: Georgia, 'Times New Roman', serif;
  background: #fff;
  color: #3d3429;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
#app {
  width: 500px;
  height: 178px;
  display: flex;
  flex-direction: column;
}
#header {
  flex-shrink: 0;
  background: #fff;
  border-bottom: 1px solid #ddd;
  padding: 6px 10px;
}
#controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;
}
.ctrl-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ctrl-group.stack-n {
  gap: 3px;
}
.ctrl-group label { color: #6b5d4d; }
input[type="number"] {
  padding: 3px 6px;
  border: 1px solid #a8957a;
  border-radius: 4px;
  font-size: 11px;
  font-family: Arial, Helvetica, sans-serif;
  background: #fff;
  color: #4a3f32;
  width: 52px;
}
.ctrl-group.stack-n input[type="number"] {
  width: 34px;
  padding: 3px 2px;
}
#speed-input {
  width: 58px;
  padding: 3px 6px;
}
.speed-field {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.speed-field .unit {
  color: #6b5d4d;
  font-size: 11px;
  white-space: nowrap;
}
button {
  padding: 4px 10px;
  border: 1px solid #7a6548;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  font-family: Arial, Helvetica, sans-serif;
  background: #fff;
  color: #4a3f32;
  box-shadow: 0 1px 2px rgba(0,0,0,0.12);
}
button:hover { background: #fff; }
button:disabled {
  opacity: 0.45;
  cursor: default;
}
#canvas-wrap {
  flex: 0 0 146px;
  height: 146px;
  position: relative;
  overflow: hidden;
}
#c {
  display: block;
  width: 500px;
  height: 146px;
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="controls">
      <div class="ctrl-group stack-n">
        <label for="n-red-input">Red N</label>
        <input type="number" id="n-red-input" min="1" max="10" value="3">
      </div>
      <div class="ctrl-group stack-n">
        <label for="n-blue-input">Blue N</label>
        <input type="number" id="n-blue-input" min="1" max="10" value="3">
      </div>
      <div class="ctrl-group">
        <label for="speed-input">Red initial speed</label>
        <span class="speed-field">
          <input type="number" id="speed-input" min="0.5" max="20" step="0.5" value="4">
          <span class="unit">m/s</span>
        </span>
      </div>
      <button id="run-btn" type="button">Run</button>
      <button id="reset-btn" type="button">Reset</button>
    </div>
  </div>
  <div id="canvas-wrap">
    <canvas id="c" width="500" height="146"></canvas>
  </div>
</div>
<script>
(function () {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const nRedInput = document.getElementById('n-red-input');
  const nBlueInput = document.getElementById('n-blue-input');
  const speedInput = document.getElementById('speed-input');
  const runBtn = document.getElementById('run-btn');
  const resetBtn = document.getElementById('reset-btn');

  const W = 500;

  const MAX_N = 10;
  const CHIP_RX = 22;
  const CHIP_RY = 8;
  const CHIP_THICK = 6;
  const STACK_TOP_Y = 24;
  const TABLE_LEFT = 28;
  const TABLE_RIGHT = W - 28;
  const PX_PER_UNIT = 38;
  const SURFACE_EXTEND = 50;
  const tableY = STACK_TOP_Y + (MAX_N - 1) * CHIP_THICK;
  const surfaceY = tableY + CHIP_RY + 2;
  const H = surfaceY + SURFACE_EXTEND + 8;
  const velReadoutY = surfaceY + SURFACE_EXTEND * 0.52;

  canvas.width = W;
  canvas.height = H;
  canvas.style.height = H + 'px';
  document.getElementById('canvas-wrap').style.height = H + 'px';
  document.getElementById('canvas-wrap').style.flexBasis = H + 'px';
  const appH = 32 + H;
  document.getElementById('app').style.height = appH + 'px';
  document.body.style.height = appH + 'px';

  let nRed = 3;
  let nBlue = 3;
  let v0 = 4;
  let redX = 0;
  let blueX = 0;
  let redV = 0;
  let blueV = 0;
  let phase = 'idle';
  let lastT = 0;
  let animId = null;
  let collided = false;
  let separateStart = 0;
  let redVelLabelX = 0;
  let blueVelLabelX = 0;
  let finalRedV = null;
  let finalBlueV = null;

  function clampN(v) {
    const n = parseInt(v, 10);
    if (!Number.isFinite(n)) return 3;
    return Math.max(1, Math.min(10, n));
  }

  function readStackCounts() {
    nRed = clampN(nRedInput.value);
    nBlue = clampN(nBlueInput.value);
    nRedInput.value = nRed;
    nBlueInput.value = nBlue;
  }

  function clampSpeed(v) {
    const s = parseFloat(v);
    if (!Number.isFinite(s)) return 4;
    return Math.max(0.5, Math.min(20, s));
  }

  function stackWidth() {
    return CHIP_RX * 2 / PX_PER_UNIT;
  }

  function layoutStacks() {
    const sw = stackWidth();
    const tableStart = TABLE_LEFT / PX_PER_UNIT;
    const tableSpan = (TABLE_RIGHT - TABLE_LEFT) / PX_PER_UNIT;
    blueX = tableStart + tableSpan * 0.56 - sw / 2;
    redX = tableStart + 0.5;
    redVelLabelX = stackCenterX(redX);
    blueVelLabelX = stackCenterX(blueX);
  }

  function elasticCollision(m1, m2, u1, u2) {
    const sum = m1 + m2;
    const v1 = ((m1 - m2) * u1 + 2 * m2 * u2) / sum;
    const v2 = ((m2 - m1) * u2 + 2 * m1 * u1) / sum;
    return { v1, v2 };
  }

  function worldToScreen(x, yStack) {
    return {
      x: TABLE_LEFT + x * PX_PER_UNIT,
      y: tableY - yStack * CHIP_THICK
    };
  }

  function contactX() {
    return blueX - stackWidth();
  }

  function stackCenterX(x) {
    return TABLE_LEFT + (x + stackWidth() / 2) * PX_PER_UNIT + CHIP_RX;
  }

  function drawSurface() {
    ctx.fillStyle = '#e5ddd0';
    ctx.fillRect(TABLE_LEFT, surfaceY, TABLE_RIGHT - TABLE_LEFT, SURFACE_EXTEND);

    ctx.strokeStyle = '#c4b5a0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(TABLE_LEFT, surfaceY);
    ctx.lineTo(TABLE_RIGHT, surfaceY);
    ctx.stroke();
  }

  function chipColors(base, edge) {
    return { top: base, rim: edge, side: edge };
  }

  const RED = chipColors('#c93a32', '#8a2218');
  const BLUE = chipColors('#3a6eb8', '#1a4080');

  function drawChip(cx, cy, colors) {
    const rx = CHIP_RX;
    const ry = CHIP_RY;

    ctx.fillStyle = colors.side;
    ctx.beginPath();
    ctx.ellipse(cx, cy + 3, rx, ry * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = colors.rim;
    ctx.beginPath();
    ctx.ellipse(cx, cy + 1, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = colors.top;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx - 2, ry - 1.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx - 2, ry - 1.5, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(cx - 6, cy - 2, rx * 0.35, ry * 0.35, -0.3, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStack(x, count, colors) {
    for (let i = 0; i < count; i++) {
      const p = worldToScreen(x, i);
      drawChip(p.x + CHIP_RX, p.y, colors);
    }
  }

  function formatVel(v) {
    const s = Math.abs(v).toFixed(2);
    return 'v = ' + (v >= 0 ? '+' : '−') + s + ' m/s';
  }

  function stackArrowY(x, count) {
    return worldToScreen(x, count - 1).y - 10;
  }

  function drawVelocityVector(x, count, vel, color) {
    if (Math.abs(vel) < 0.05) return;

    const cx = stackCenterX(x);
    const y = stackArrowY(x, count);
    const dir = vel > 0 ? 1 : -1;
    const len = Math.min(48, 8 + Math.abs(vel) * 5);

    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, y);
    ctx.lineTo(cx + dir * len, y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx + dir * len, y);
    ctx.lineTo(cx + dir * (len - 7), y - 3);
    ctx.lineTo(cx + dir * (len - 7), y + 3);
    ctx.closePath();
    ctx.fill();
  }

  function currentRedVel() {
    if (phase === 'done') return finalRedV;
    return redV;
  }

  function currentBlueVel() {
    if (phase === 'done') return finalBlueV;
    return blueV;
  }

  function showVelocityVectors() {
    return phase !== 'idle';
  }

  function drawFixedVelocityReadouts() {
    if (!showVelocityVectors()) return;

    ctx.font = '11px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#b83828';
    ctx.fillText(formatVel(currentRedVel()), redVelLabelX, velReadoutY);

    ctx.fillStyle = '#2a5a9e';
    ctx.fillText(formatVel(currentBlueVel()), blueVelLabelX, velReadoutY);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    drawSurface();
    drawStack(blueX, nBlue, BLUE);
    drawStack(redX, nRed, RED);

    if (showVelocityVectors()) {
      drawVelocityVector(redX, nRed, currentRedVel(), '#b83828');
      drawVelocityVector(blueX, nBlue, currentBlueVel(), '#2a5a9e');
    }

    drawFixedVelocityReadouts();
  }

  function setControlsEnabled(on) {
    nRedInput.disabled = !on;
    nBlueInput.disabled = !on;
    speedInput.disabled = !on;
    runBtn.disabled = !on;
  }

  function stopAnim() {
    if (animId != null) {
      cancelAnimationFrame(animId);
      animId = null;
    }
  }

  function doCollision() {
    const result = elasticCollision(nRed, nBlue, redV, blueV);
    redV = result.v1;
    blueV = result.v2;
    finalRedV = redV;
    finalBlueV = blueV;
    collided = true;
    phase = 'separate';
    separateStart = performance.now();
  }

  function tick(now) {
    if (phase === 'idle') return;

    const dt = Math.min(0.032, (now - lastT) / 1000);
    lastT = now;

    if (phase === 'approach') {
      redX += redV * dt;
      if (redX + stackWidth() >= blueX - 0.001) {
        redX = contactX();
        doCollision();
      }
    } else if (phase === 'separate') {
      redX += redV * dt;
      blueX += blueV * dt;

      const gap = blueX - (redX + stackWidth());
      const elapsed = now - separateStart;
      const separateMinMs = 4000;
      const separateMaxMs = 9000;
      if (elapsed > separateMinMs && (elapsed > separateMaxMs || gap > stackWidth() * 2.5)) {
        phase = 'done';
        setControlsEnabled(true);
      }
    }

    draw();

    if (phase === 'done') {
      animId = null;
      return;
    }

    animId = requestAnimationFrame(tick);
  }

  function run() {
    stopAnim();
    readStackCounts();
    v0 = clampSpeed(speedInput.value);
    speedInput.value = v0;

    layoutStacks();
    redV = v0;
    blueV = 0;
    collided = false;
    finalRedV = null;
    finalBlueV = null;
    phase = 'approach';
    setControlsEnabled(false);
    lastT = performance.now();
    draw();
    animId = requestAnimationFrame(tick);
  }

  function reset() {
    stopAnim();
    readStackCounts();
    v0 = clampSpeed(speedInput.value);
    speedInput.value = v0;

    layoutStacks();
    redV = 0;
    blueV = 0;
    collided = false;
    finalRedV = null;
    finalBlueV = null;
    phase = 'idle';
    setControlsEnabled(true);
    draw();
  }

  runBtn.addEventListener('click', run);
  resetBtn.addEventListener('click', reset);
  function onStackCountChange() {
    if (phase === 'idle') {
      readStackCounts();
      layoutStacks();
      draw();
    }
  }
  nRedInput.addEventListener('change', onStackCountChange);
  nBlueInput.addEventListener('change', onStackCountChange);
  speedInput.addEventListener('change', () => {
    speedInput.value = clampSpeed(speedInput.value);
  });

  readStackCounts();
  layoutStacks();
  draw();
})();
</script>
</body>
</html>
